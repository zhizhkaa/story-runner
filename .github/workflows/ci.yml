name: CI and Deploy

on:
  push:
    branches: ["**"]
    tags: ["deploy-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run css:build
      - run: python manage.py test
      - run: python manage.py check
      - run: python manage.py collectstatic --noinput
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-secret
          ADMIN_PASSWORD: ci-only-password
      - run: docker build -t story-runner:test .

  deploy:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/deploy-')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: story-runner-production
      cancel-in-progress: true
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/story-runner
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 is required: install the docker compose plugin before deployment." >&2
              exit 1
            fi
            if ! docker network inspect zhizhka-web >/dev/null 2>&1; then
              echo "External network zhizhka-web is missing: deploy zhizhka-infra first." >&2
              exit 1
            fi
            git fetch origin "${{ github.ref }}"
            git checkout --detach "${{ github.sha }}"
            docker compose config --quiet
            docker compose build
            if ! docker compose up -d web; then
              docker compose ps
              docker compose logs --no-color --tail=200 web
              exit 1
            fi
            docker compose exec -T web python manage.py check --deploy
            curl --fail --retry 12 --retry-delay 5 \
              --header 'Host: story.zhizhka.ru' \
              http://127.0.0.1:8001/healthz/
            docker compose ps
            docker image prune -f
